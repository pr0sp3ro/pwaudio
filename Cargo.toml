[package]
name = "pwaudio"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal audio control panel for PipeWire"
license = "MIT"
repository = "https://github.com/pr0sp3ro/pwaudio"
readme = "README.md"
keywords = ["pipewire", "audio", "terminal", "tui"]
categories = ["command-line-utilities", "multimedia::audio"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "contrib/**"]

[dependencies]
crossterm = "0.29"
fs2 = "0.4"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "0.8"
